##### Prefix: Ctrl-a instead of Ctrl-b #####

unbind C-b
set -g prefix C-a
bind C-a send-prefix


##### Splits: no prefix required #####

unbind -n C-y
unbind -n C-h
# Ctrl-h = vertical split: left/right
##### Detect vim #####
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(n?vim|vim|view|lvim)$'"

##### Ctrl = vim-aware splits #####

unbind -n C-y
unbind -n C-h

# C-y → side-by-side (vertical split)
bind -n C-y if-shell "$is_vim" "send-keys C-y" "split-window -h -c '#{pane_current_path}'"

# C-h → top/bottom (horizontal split)
bind -n C-h if-shell "$is_vim" "send-keys C-h" "split-window -v -c '#{pane_current_path}'"


##### Alt = always tmux splits #####

unbind -n M-y
unbind -n M-h

# M-y → side-by-side
bind -n M-y split-window -h -c "#{pane_current_path}"

# M-h → top/bottom
bind -n M-h split-window -v -c "#{pane_current_path}"

##### Alt = always tmux splits #####

unbind -n M-y
unbind -n M-h

# Alt-y = side-by-side panes
bind -n M-y split-window -v -c "#{pane_current_path}"

# Alt-h = top/bottom panes
bind -n M-h split-window -h -c "#{pane_current_path}"

##### Vim / tmux pane navigation with Ctrl + arrow keys #####

unbind -n C-Left
unbind -n C-Right
unbind -n C-Up
unbind -n C-Down

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(n?vim|vim|view|lvim)$'"

bind -n C-Left  if-shell "$is_vim" "send-keys C-Left"  "select-pane -L"
bind -n C-Down  if-shell "$is_vim" "send-keys C-Down"  "select-pane -D"
bind -n C-Up    if-shell "$is_vim" "send-keys C-Up"    "select-pane -U"
bind -n C-Right if-shell "$is_vim" "send-keys C-Right" "select-pane -R"


##### Easy reload #####

unbind r
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

##### Direct tmux splits with Alt keys #####

unbind -n M-y
unbind -n M-h

# Alt-y = always horizontal tmux split
bind -n M-y split-window -v -c "#{pane_current_path}"

# Alt-h = always vertical tmux split
bind -n M-h split-window -h -c "#{pane_current_path}"

##### Alt = always tmux splits #####

unbind -n M-y
unbind -n M-h

# Alt-y = side-by-side panes
bind -n M-y split-window -h -c "#{pane_current_path}"

# Alt-h = top/bottom panes
bind -n M-h split-window -v -c "#{pane_current_path}"


set -g mouse on


##### Alt + Arrow = ALWAYS tmux navigation #####

unbind -n M-Left
unbind -n M-Right
unbind -n M-Up
unbind -n M-Down

bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D


bind v copy-mode
# Use vi-style keys in copy mode
setw -g mode-keys vi

# v = start selection (like visual mode)
bind -T copy-mode-vi v send -X begin-selection

# y = yank/copy selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# optional: mouse copy behaves better
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g focus-events on
